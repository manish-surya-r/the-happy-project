site_name: Zeal Core
site_url: https://manish-surya-r.github.io/zeal-core/
site_description: >-
  Precision-crafted courses on software engineering, system design, and computer science fundamentals.
site_author: Manish Sri Sai Surya Routhu

copyright: >-
  © 2025 Zeal Core &nbsp;·&nbsp;
  <a href="#__consent">Manage cookies</a>

# ─────────────────────────────────────────
#  THEME
# ─────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/overrides

  logo: assets/zeal-core-logo.svg
  favicon: assets/zeal-core-logo.svg

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    # toc.integrate REMOVED — this was pushing TOC into left sidebar.
    # Without it, TOC appears correctly on the RIGHT side.
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

  palette:
    # Fix 2: Start with dark, toggle goes to light correctly
    # MkDocs Material reads palettes top-to-bottom.
    # First entry = default on first visit.
    # The toggle on palette[0] switches TO palette[1], and vice versa.
    - scheme: slate           # dark — shown first / default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode   # clicking this goes to light

    - scheme: default         # light — toggled into
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode    # clicking this goes back to dark

# ─────────────────────────────────────────
#  PLUGINS
# ─────────────────────────────────────────
plugins:
  - search:
      lang: en
  - tags

# ─────────────────────────────────────────
#  MARKDOWN EXTENSIONS
# ─────────────────────────────────────────
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - footnotes
  - abbr
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

# ─────────────────────────────────────────
#  EXTRA CSS & JS
# ─────────────────────────────────────────
extra_css:
  - assets/stylesheets/zeal.css

extra_javascript:
  - assets/javascripts/zeal.js

# ─────────────────────────────────────────
#  EXTRA CONFIG
# ─────────────────────────────────────────
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/manish-surya-r
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com
      name: LinkedIn

  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognise your repeated visits and preferences, and to
      measure how visitors find content. With your consent you help us improve.
    actions:
      - accept
      - manage
      - reject

  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Yes!
          data: 1
          note: Thanks for the feedback!
        - icon: material/emoticon-sad-outline
          name: Could be better
          data: 0
          note: >-
            Thanks for letting us know. You can
            <a href="https://github.com/manish-surya-r/zeal-core/issues/new">open an issue</a>
            to tell us what's missing.

repo_url: https://github.com/manish-surya-r/zeal-core
repo_name: zeal-core
edit_uri: edit/main/docs/

