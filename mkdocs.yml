site_name: Zeal Core
site_url: https://manish-surya-r.github.io/zeal-core
site_description: >-
  Precision-crafted courses on software engineering, system design, and computer science fundamentals.
site_author: Manish Sri Sai Surya Routhu

copyright: >-
  © 2025 Zeal Core &nbsp;·&nbsp;
  <a href="#__consent">Manage cookies</a>

# ─────────────────────────────────────────
#  THEME
# ─────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/overrides        # for home-page hero & custom HTML blocks

  logo: assets/zeal-core-logo.svg             # place a simple SVG logo in docs/assets/
  favicon: assets/zeal-core-logo.svg

  font:
    text: DM Sans                   # clean, modern — not Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    # ── Navigation ──────────────────────────
    - navigation.tabs               # top-level tabs in header
    - navigation.tabs.sticky        # tabs stay visible while scrolling
    - navigation.sections           # show section headers in left sidebar
    - navigation.expand             # auto-expand active section
    - navigation.indexes            # section index pages (Overview pages)
    - navigation.top                # "back to top" button
    - toc.follow                    # TOC highlight follows scroll
    - toc.integrate                 # ← subtopics of current page visible on LEFT sidebar
    # ── Search ──────────────────────────────
    - search.suggest
    - search.highlight
    - search.share
    # ── Content ─────────────────────────────
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # ── Header ──────────────────────────────
    - header.autohide

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# ─────────────────────────────────────────
#  PLUGINS
# ─────────────────────────────────────────
plugins:
  - search:
      lang: en
  - tags

# ─────────────────────────────────────────
#  MARKDOWN EXTENSIONS
# ─────────────────────────────────────────
markdown_extensions:
  # Code blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Tabs
  - pymdownx.tabbed:
      alternate_style: true
  # Admonitions (callout boxes)
  - admonition
  - pymdownx.details
  # Formatting
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # Emoji & Icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Task lists
  - pymdownx.tasklist:
      custom_checkbox: true
  # Tables, footnotes, abbreviations
  - tables
  - footnotes
  - abbr
  - attr_list
  - def_list
  - md_in_html
  # TOC
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

# ─────────────────────────────────────────
#  EXTRA CSS & JS  (animations + palette)
# ─────────────────────────────────────────
extra_css:
  - assets/stylesheets/zeal.css

extra_javascript:
  - assets/javascripts/zeal.js

# ─────────────────────────────────────────
#  EXTRA CONFIG
# ─────────────────────────────────────────
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/manish-surya-r
      name: GitHub
    # - icon: fontawesome/brands/youtube
    #   link: https://youtube.com
    #   name: YouTube — Zeal Core
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com
      name: LinkedIn

  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognise your repeated visits and preferences, and to
      measure how visitors find content. With your consent you help us improve.
    actions:
      - accept
      - manage
      - reject

  analytics:
    provider: google
    property: G-XXXXXXXXXX       # replace with your GA4 property ID
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Yes!
          data: 1
          note: Thanks for the feedback!
        - icon: material/emoticon-sad-outline
          name: Could be better
          data: 0
          note: >-
            Thanks for letting us know. You can <a href="https://github.com/manish-surya-r/the-entanglement-project/issues/new">open an issue</a> to tell us what's missing.

repo_url: https://github.com/manish-surya-r/the-entanglement-project
repo_name: zeal-core
edit_uri: edit/main/docs/

